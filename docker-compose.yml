services:
  postgres:
    image: postgres:16-alpine
    container_name: student-dashboard-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: student_dashboard
      POSTGRES_USER: dashboard_user
      POSTGRES_PASSWORD: changeme
    ports:
      - "5432:5432"
    volumes:
      - dashboard_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dashboard_user -d student_dashboard"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  dashboard_pg_data:
